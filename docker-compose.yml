name: ${COMPOSE_PROJECT_NAME:-policy-assistant}

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: ${FRONTEND_IMAGE:-policy-assistant-frontend:local}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: ${BACKEND_IMAGE:-policy-assistant-backend:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OBJECT_STORAGE_PROVIDER: minio
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      QUEUE_PROVIDER: rocketmq
      QUEUE_URL: rocketmq-namesrv:9876
    volumes:
      - backend-uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rocketmq-broker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    image: ${BACKEND_IMAGE:-policy-assistant-backend:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OBJECT_STORAGE_PROVIDER: minio
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      QUEUE_PROVIDER: rocketmq
      QUEUE_URL: rocketmq-namesrv:9876
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_started
      rocketmq-broker:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    restart: unless-stopped
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876"]
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
    depends_on:
      rocketmq-namesrv:
        condition: service_started

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      minio:
        condition: service_started

volumes:
  backend-uploads:
  postgres-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
  minio-data:
